name: Build SatLink Share PRO

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: PC protocol tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v

  android:
    name: Android APK
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.SATLINK_KEYSTORE_BASE64 }}
      SATLINK_KEYSTORE_PASSWORD: ${{ secrets.SATLINK_KEYSTORE_PASSWORD }}
    defaults:
      run:
        working-directory: Android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key (from GitHub Secrets)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/satlink-release.jks"
          echo "SATLINK_KEYSTORE=$RUNNER_TEMP/satlink-release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK
        if: env.KEYSTORE_BASE64 != ''
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "SatLink-Share-PRO.apk"
      - name: Build debug APK (no signing key yet)
        if: env.KEYSTORE_BASE64 == ''
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "SatLink-Share-PRO.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: SatLink-Share-PRO-Android
          path: Android/SatLink-Share-PRO.apk

  windows:
    name: Windows EXE (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            python_arch: x64
            requirements: requirements-win64.txt
          - arch: x32
            python_arch: x86
            requirements: requirements-win32.txt
    defaults:
      run:
        working-directory: PC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.python_arch }}
      - name: Install dependencies
        run: python -m pip install "--only-binary=:all:" -r ${{ matrix.requirements }}
      - name: Build EXE
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name "SatLink Share PRO PC ${{ matrix.arch }}"
          --icon assets/satlink_share_pc_icon.ico
          --add-data "assets;assets"
          satlink_share_pc.py
      - uses: actions/upload-artifact@v4
        with:
          name: SatLink-Share-PRO-PC-${{ matrix.arch }}
          path: PC/dist/*.exe

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tests, android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          files: out/**/*
